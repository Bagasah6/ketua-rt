a perlu atur ulang."],sponsor_warung:["pak_joko","pak_joko","Pak RT, saya mau bantu dana kegiatan. Syaratnya ringan: spanduk warung saya dipasang di pos ronda. Gimana?"],bantuan_kelurahan:["pengurus","bu_rina","Pak, kelurahan buka dana bantuan kebersihan. Harus lewat proposal, prosesnya agak lama. Mau dicoba?"],tempat_sampah_penuh:["bu_wati","bu_wati","Pak, bak sampah ujung gang sudah meluber. Kucing pada bongkar, baunya ke mana-mana."],bank_sampah_proposal:["pengurus","bu_sari","Pak RT, saya dan Bu Wati punya ide: bank sampah! Warga nabung sampah, ditimbang tiap bulan. Bisa nambah kas juga."],nyamuk_dbd:["bu_lina","bu_lina","Pak, nyamuk di gang banyak sekali. Anak tetangga sudah demam dua hari. Sebaiknya cepat ditangani."],pasar_kaget:["pak_joko","pak_joko","Pak, ada pedagang yang mau jualan tiap Minggu pagi di ujung gang. Ramai, bagus buat warga. Boleh ya?"],hujan_deras:["grup","pak_ujang","Hujan dari subuh belum berhenti. Tikungan gang mulai tergenang, yang punya motor diparkir di tempat tinggi ya."],kemarau_panjang:["grup","bu_wati","Sumur saya mulai kering. Sudah berminggu-minggu nggak hujan, debunya juga bikin batuk."],pohon_tumbang:["grup","pak_arman","Pohon mangga tumbang semalam, nutup separuh jalan. Motor masih bisa lewat, tapi harus pelan."],ronda_bolong:["pengurus","pak_ujang","Pak, dua malam pos ronda kosong. Yang kebagian giliran pada berhalangan semua."],orang_asing:["pak_budi","pak_budi","Pak RT, semalam saya lihat dua orang asing mondar-mandir, kayak lagi ngamatin rumah. Saya nggak tenang."],anak_nongkrong:["pak_budi","pak_budi","Pak, anak-anak muda nongkrong di depan warung sampai lewat tengah malam. Berisik, saya khawatir."],paket_hilang:["sinta","sinta","Pak RT, paket saya hilang dari depan pagar. Katanya tetangga lain juga pernah. Saya jadi was-was."],surat_pengantar:["bu_lina","bu_lina","Pak, saya butuh surat pengantar hari ini untuk kantor. Bu Rina bilang berkasnya harus lengkap dulu… bisa dibantu?"],warga_baru_sinta:["sinta","sinta","Selamat sore, Pak. Saya Sinta, baru pindah ke kontrakan ujung. Mau lapor diri, saya sudah bawa fotokopi KTP."],pendataan_ulang:["pengurus","bu_rina","Pak, kelurahan minta data KK diperbarui bulan ini. Saya siap, tapi harus datangi warga satu per satu."],warga_sakit:["bu_wati","bu_wati","Pak, tetangga di gang belakang masuk rumah sakit. Keluarganya kesulitan biaya. Kita bisa bantu apa ya?"],grup_wa_ribut:["pengurus","bu_rina","Pak, grup warga panas lagi. Bu Maya dan Pak Arman saling sindir, beberapa warga sudah keluar grup."],hajatan_izin:["bu_wati","bu_wati","Pak RT, Sabtu ini keluarga saya hajatan. Tendanya agak makan jalan, boleh pinjam kursi dan sound RT?"],warga_curhat:["bu_lina","bu_lina","Pak, maaf mau curhat sebentar. Jadwal jaga malam saya padat banget, saya nggak sanggup ikut ronda dan kerja bakti."],kerja_bakti:["bu_sari","bu_sari","Pak, bagaimana kalau Minggu pagi kita kerja bakti besar? Daftar hadir sudah saya siapkan, konsumsi ada yang mau bantu."],turnamen_futsal:["raka","raka","Pak RT, anak-anak mau bikin turnamen futsal antar-RT! Seru buat silaturahmi. Boleh kita jalan?"],arisan_posyandu:["bu_sari","bu_sari","Pak, bulan ini arisan sekaligus posyandu. Kami butuh tempat dan sedikit konsumsi dari RT."],mural_andi:["andi","andi","Pak RT! Tembok kosong ujung gang boleh saya mural? Konsepnya bebas tapi bermakna 🎨"],parking_dispute:["bu_maya","bu_maya","Pak, mobil Pak Hendra parkir di depan rumah saya lagi. Saya susah keluar. Ini sudah sering."],loud_music:["pak_budi","pak_budi","Pak RT, band Andi latihan sampai setengah dua belas malam. Saya nggak bisa tidur sama sekali."],renovation_noise:["bu_lina","bu_lina","Pak, renovasi rumah sebelah mulai jam tujuh pagi. Saya baru tidur setelah jaga malam 😩"],shop_hours:["pak_joko","pak_joko","Pak RT, warung saya mau buka sampai tengah malam. Banyak ojol cari makan. Boleh, kan?"],road_access:["pak_hendra","pak_hendra","Pak, truk pasokan warung parkir di gang lagi pagi ini. Mobil saya terkurung, saya telat ke kantor."],pet_co apak ibu-ibu, lampu di ujung gang sore ini diperbaiki tukang listrik langganan ya. Malam ini insyaallah sudah terang lagi 💡",wait:"Info warga: lampu ujung gang baru bisa diganti awal bulan depan, kas lagi kami jaga. Sementara kalau pulang malam bawa senter atau bareng-bareng ya 🙏",patungan:"Bapak-ibu, bohlam ujung gang sudah saya belikan. Untuk kap dan kabelnya kita patungan seikhlasnya ya, nanti dikumpulkan di Pak Ujang."},pos:["Alhamdulillah, ibu-ibu jadi berani lewat lagi.","Siap, makasih Pak RT 👍"],neg:["Bulan depan masih lama, Pak. Gelap banget itu.","Lho, kok patungan lagi? Iuran bulanan buat apa?"]},gutter_clogged:{t:"g",c:{kerja_bakti:"Assalamualaikum. Minggu pagi kita keruk selokan tikungan bareng-bareng ya. Bawa cangkul atau sekop kalau ada. Kumpul jam 7 di pos ronda.",tukang:"Info: selokan tikungan besok dikeruk tukang, biayanya dari kas RT. Mohon motor jangan parkir di situ dulu ya.",biarkan:["bu_wati","Bu Wati, selokannya saya pantau dulu ya. Kalau hujan besar lagi, langsung kabari saya."]},pos:["Siap, saya bawa sekop!","Mantap, Pak RT."],neg:["Minggu pagi saya ada acara, Pak.","Nunggu banjir dulu baru gerak?"],by:{bu_wati:{pos:"Alhamdulillah, teras saya aman lagi.",neg:"Air bisa masuk teras saya lagi, Pak…"}}},pos_ronda_bocor:{t:"g",c:{full:"Bapak-bapak, atap pos ronda minggu ini diganti total, genteng dan talangnya baru. Yang jaga malam nanti nggak kehujanan lagi 💪",tambal:"Atap pos ronda sementara ditambal terpal dulu ya, Bapak-bapak. Perbaikan total nanti kalau kas sudah longgar.",pindah:"Selama atap pos bocor, ronda pindah sementara ke teras rumah Pak Ujang ya. Terima kasih Pak Ujang sudah menampung 🙏"},pos:["Mantap, ronda jadi semangat lagi.","Siap, nanti saya bawa termos kopi."],neg:["Terpal doang kuat berapa lama, Pak?","Teras rumah orang kok jadi pos ronda…"]},road_pothole:{t:"g",c:{cor:"Info warga: lubang depan warung Pak Joko besok dicor tukang. Motor lewat pelan-pelan dulu ya, semennya belum kering.",kelurahan:"Lubang jalan depan warung sudah saya ajukan ke kelurahan. Sambil menunggu, saya pasang tanda bahaya. Hati-hati lewat ya, Bapak-ibu.",patungan:"Bapak-ibu, lubang depan warung kita cor sendiri hari Sabtu. Yang mau urunan semen atau tenaga, kabari saya ya 🙏"},pos:["Alhamdulillah, jalannya mulus lagi.","Sabtu saya bisa bantu ngaduk semen."],neg:["Kelurahan mah bisa berbulan-bulan, Pak.","Urunan terus, Pak. Kas RT ke mana?"],by:{pak_joko:{pos:"Alhamdulillah, pelanggan saya nggak oleng lagi.",neg:"Pelanggan saya bisa jatuh, Pak."}}},air_pdam_mati:{t:"g",c:{tangki:"Bapak-ibu, mobil tangki air datang jam 4 sore di mulut gang. Silakan bawa ember dan jeriken, antre yang tertib ya 🚰",koordinasi:"Update PDAM: kata petugas, pipa utama sedang diperbaiki dan air mengalir lagi paling lambat lusa. Nanti saya kabari lagi kalau ada info baru.",sumur:"Bapak-ibu yang punya sumur, boleh berbagi air dulu buat tetangga ya? Yang butuh, silakan japri saya, nanti saya hubungkan 🙏"},pos:["Alhamdulillah, bisa mandi juga akhirnya.","Rumah saya ada sumur, silakan ambil."],neg:["Lusa? Hari ini kita mandi pakai apa, Pak?","Sumur saya juga mulai surut, Pak."]},kabel_semrawut:{t:"g",c:{teknisi:"Info: besok pagi teknisi merapikan kabel di tiang gang. Listrik mungkin padam sebentar sekitar jam 10, mohon maklum ya.",imbau:"Bapak-ibu, tolong cek kabel listrik dan internet ke rumah masing-masing ya. Kalau ada yang kelupas atau menjuntai, mohon dirapikan 🙏",abaikan:["pak_ujang","Pak Ujang, kabel tiang kita pantau dulu ya. Kalau ada percikan sedikit saja, langsung kabari saya."]},pos:["Nah, aman. Takut anak-anak kesetrum.","Siap, nanti sore saya cek punya saya."],neg:["Dirapikan sendiri? Mana ngerti saya, Pak.","Nunggu korslet dulu, Pak?"]},iuran_menunggak:{t:"g",c:{door:"Bapak-ibu, minggu ini saya mampir ke beberapa rumah untuk silaturahmi sekalian urusan iuran ya. Mohon maaf kalau mengganggu 🙏",papan:"Pengingat ramah: iuran bulanan RT Rp30.000 bisa dibayar ke Pak Dedi. Terima kasih untuk yang sudah membayar tepat waktu 🙏",keringanan:"Info iuran: untuk yang sedang kesulitan, pembayaran iuran bulan ini boleh menyusul sampai bulan depan ya. Japri saya saja, aman.",bendahara:["pengurus","Pak Dedi, mohon bantu tagih iuran yang telat ya. Bapak yang paling hafal datanya. Sampaikan baik-baik 🙏"]},pos:["Siap Pak, nanti malam saya transfer.","Makasih keringanannya, Pak RT. Lagi seret bulan ini."],neg:["Didatangi ke rumah kok rasanya malu ya.","Yang telat dikasih keringanan, yang rajin dapat apa?"]},laporan_keuangan:{t:"g",c:{terbuka:"Bapak-ibu, laporan kas lengkap bulan ini sudah ditempel di papan pengumuman pos ronda. Semua pemasukan dan pengeluaran ada di situ, silakan dicek 📋",ringkas:"Ringkasan kas bulan ini: total pemasukan dan pengeluaran sudah saya rangkum di sini. Rinciannya bisa ditanyakan ke Pak Dedi ya.",rapat:"Laporan kas akan saya presentasikan di rapat warga nanti, sekalian tanya jawab. Silakan siapkan pertanyaannya, Bapak-ibu.",tunda:"Mohon maaf, laporan kas masih kami susun. Insyaallah bulan depan dibagikan lengkap ya 🙏"},pos:["Nah, gini dong. Jelas dan terbuka.","Terima kasih, Pak RT. Saya cek nanti."],neg:["Ringkasan saja? Rinciannya mana, Pak?","Bulan depan? Kenapa harus ditunda?"]},kas_menipis:{t:"g",c:{iuran:"Bapak-ibu, mulai bulan depan iuran RT naik 30% karena biaya perawatan terus naik. Rinciannya nanti dibahas di rapat ya. Mohon pengertiannya 🙏",hemat:["pengurus","Bapak-ibu pengurus, untuk sementara kita tunda perawatan yang belum mendesak ya. Kas harus dijaga dulu."],sponsor:["pengurus","Teman-teman pengurus, minggu ini saya keliling ke warung dan toko cari sponsor kegiatan. Ada yang mau ikut?"]},pos:["Wajar sih, harga-harga juga naik.","Siap Pak, saya ikut keliling."],neg:["Naik 30% berat, Pak. Bukan cuma saya yang keberatan.","Kalau perawatan ditunda, nanti rusaknya makin parah."]},sponsor_warung:{t:"g",c:{terima:"Kabar baik: Warung Pak Joko jadi sponsor kegiatan RT. Spanduknya dipasang di pos ronda ya. Terima kasih, Pak Joko 🙏",syarat:"Warung Pak Joko jadi sponsor kegiatan RT, dengan spanduk ukuran kecil di samping papan pengumuman saja. Terima kasih, Pak Joko 🙏",tolak:["pak_joko","Pak Joko, terima kasih banyak tawaran sponsornya. Untuk sekarang RT mau tetap netral dulu ya, Pak. Mohon maaf 🙏"]},pos:["Mantap, kas jadi ada napas.","Lumayan buat kegiatan."],neg:["Pos ronda jadi kayak papan iklan.","RT harusnya netral, Pak."],by:{pak_joko:{pos:"Sama-sama, Pak RT. Semoga berkah buat semua.",neg:"Yah, padahal niat saya bantu, Pak."}}},bantuan_kelurahan:{t:"p",c:{lengkap:"Bu Rina, proposal dana kebersihan kita susun lengkap ya, pakai foto dan rincian anggaran. Saya bantu ambil fotonya besok.",singkat:"Bu Rina, proposal ke kelurahan cukup dua halaman saja ya. Yang penting masuk sebelum tenggat.",lewat:"Bu Rina, dana kelurahan kali ini kita lewatkan dulu ya. Tenaga kita habis buat urusan lain. Makasih infonya 🙏"},pos:["Semoga tembus, Pak.","Oke, saya bantu kalau perlu."],neg:["Dua halaman biasanya kalah sama yang lengkap.","Hmm, sayang juga."],by:{bu_rina:{pos:"Siap, Pak. Draft saya kirim lusa.",neg:"Sayang lho, Pak. Kesempatan jarang datang."}}},tempat_sampah_penuh:{t:"g",c:{perbaiki:"Bapak-ibu, bak sampah ujung gang sudah dikosongkan dan minggu ini ada tong tambahan. Mohon kantong sampah diikat rapat ya 🙏",kerja_bakti:"Sore ini kita bersihkan sampah ujung gang bareng-bareng ya. Yang bisa, bawa sarung tangan dan karung. Jam 4 di bak sampah.",tunda:"Info: petugas angkut sampah datang lusa. Sementara mohon sampah disimpan di rumah dulu ya, jangan ditumpuk di ujung gang 🙏"},pos:["Alhamdulillah, nggak bau lagi.","Siap, saya bawa karung."],neg:["Lusa? Kucingnya keburu pesta, Pak.","Simpan di rumah? Dapur saya jadi bau."]},bank_sampah_proposal:{t:"g",c:{setuju:"Kabar gembira: RT 04 akan punya bank sampah! Terima kasih Bu Wati dan Bu Sari atas idenya. Jadwal pelatihan menyusul ya ♻️",uji:"Bank sampah kita uji coba dulu di satu blok, dimulai dari blok Bu Wati. Kalau lancar, kita perluas ke seluruh RT ♻️",tolak:["bu_wati","Bu Wati, usul bank sampahnya bagus sekali. Tapi untuk sekarang kami belum siap menjalankannya. Nanti kita bahas lagi ya, Bu 🙏"]},pos:["Ibu-ibu sudah siap, Pak! ♻️","Ide bagus. Sampah jadi duit."],neg:["Satu blok dulu? Kapan blok saya?","Yah, padahal ibu-ibu sudah semangat."]},nyamuk_dbd:{t:"g",c:{fogging:"Info penting: besok sore ada fogging di seluruh gang. Mohon makanan ditutup dan anak-anak di dalam rumah dulu ya 🦟","3m":"Minggu pagi kita gerakan 3M: menguras, menutup, mengubur. Tolong cek bak mandi dan barang bekas di rumah masing-masing juga ya 🦟",imbau:"Bapak-ibu, nyamuk lagi banyak. Tolong kuras bak mandi, tutup tempat air, dan buang barang bekas yang bisa jadi genangan ya 🙏"},pos:["Alhamdulillah, semoga nyamuknya hilang.","Siap, bak mandi saya kuras nanti."],neg:["Cuma imbauan? Anak tetangga sudah demam, Pak.","Fogging bikin batuk, Pak."]},pasar_kaget:{t:"g",c:{izin:"Info: mulai Minggu ini ada pasar kaget di ujung gang. Pedagang ikut iuran kebersihan, jadi gang tetap rapi ya 🛒",terbatas:"Pasar kaget Minggu pagi diizinkan mulai jam 7, khusus di area ujung gang. Setelah jam 10 harus sudah bersih ya 🛒",tolak:"Mohon maaf, pasar kaget Minggu pagi belum bisa diizinkan dulu. Kita jaga ketenangan gang di hari libur ya 🙏"},pos:["Asyik, belanja dekat rumah.","Jam 7 masih masuk akal, Pak."],neg:["Nanti gang jadi kotor, Pak.","Rezeki pedagang jadi hilang, Pak."],by:{bu_lina:{neg:"Minggu pagi satu-satunya hari saya bisa tidur, Pak.",pos:"Makasih, Pak. Saya masih bisa tidur."}}},hujan_deras:{t:"g",c:{siaga:"Bapak-bapak, karung pasir sudah disiapkan di pos ronda. Yang rumahnya dekat tikungan, mohon bantu jaga titik rawan ya ☔",imbau:"Hujan masih deras, Bapak-ibu. Mohon waspada genangan, pindahkan barang penting ke tempat tinggi, dan kabari kalau air naik ya ☔",biarkan:null},pos:["Siap, saya standby di tikungan.","Makasih infonya, Pak."],neg:["Air sudah masuk teras saya, Pak.","Nunggu kebanjiran dulu?"]},kemarau_panjang:{t:"g",c:{hemat:"Bapak-ibu, kemarau masih panjang. Kita atur giliran pakai air per blok ya, jadwalnya saya kirim di bawah ini 💧",tangki:"Info: tangki air datang tiap Rabu dan Sabtu sore di mulut gang selama kemarau. Bawa jeriken ya 💧",biarkan:null},pos:["Alhamdulillah, ada solusi.","Jadwal giliran adil, saya ikut."],neg:["Giliran? Repot kalau pas jam kerja.","Sumur saya sudah kering, Pak."]},pohon_tumbang:{t:"g",c:{gotong:"Bapak-bapak, habis Asar kita potong pohon mangga yang tumbang di gang ya. Yang punya gergaji, mohon dibawa 🪚",tukang:"Pohon tumbang di gang siang ini dipotong tukang. Motor lewat jalan belakang dulu ya, Bapak-ibu.",tunggu:"Info: pohon tumbang di gang sedang diurus pemiliknya. Hati-hati lewat ya, Bapak-ibu 🙏"},pos:["Siap, saya bawa gergaji.","Makasih, Pak RT. Gang jadi lancar lagi."],neg:["Nunggu pemiliknya? Bisa berhari-hari, Pak.","Motor saya nggak bisa keluar, Pak."]},ronda_bolong:{t:"g",c:{denda:"Bapak-bapak, mulai minggu ini yang absen ronda tanpa kabar kena denda simbolis Rp20.000 masuk kas ya. Biar adil untuk semua 🙏",rotasi:"Jadwal ronda baru sudah jadi. Yang kerja shift dapat giliran fleksibel. Jadwal lengkapnya saya kirim di bawah ya.",satpam:"Info: mulai minggu ini ada penjaga paruh waktu di pos ronda, honornya dari kas RT. Ronda warga tetap jalan sebagai cadangan ya."},pos:["Adil, setuju.","Jadwal baru lebih masuk akal buat saya."],neg:["Denda bikin nggak enak antar tetangga.","Bayar penjaga, iuran naik lagi nanti."],by:{bu_lina:{neg:"Saya kerja malam, Pak, bukan malas.",pos:"Jadwal baru lebih masuk akal buat saya."}}},orang_asing:{t:"g",c:{tanya:"Bapak-bapak ronda, kalau ketemu orang yang nggak dikenal di gang, tolong disapa sopan dan ditanya keperluannya ya 🙏",waspada:"Info keamanan: beberapa malam ini ada orang tak dikenal mondar-mandir. Mohon pagar dan motor dikunci ya, Bapak-ibu 🔒",abaikan:["pak_budi","Pak Budi, terima kasih laporannya. Kemungkinan itu tamu warga. Saya pantau dulu ya, Pak."]},pos:["Siap, motor sudah saya kunci.","Bagus, ronda jadi lebih waspada."],neg:["Tamu kok mondar-mandir tengah malam, Pak?","Jangan sampai ada yang hilang dulu."]},anak_nongkrong:{t:"g",c:{ngobrol:"Tadi malam saya ngobrol santai sama anak-anak muda di warung. Mereka sepakat jaga suara setelah jam 10. Terima kasih, Mas-mas 👍",jam:"Bapak-ibu dan teman-teman muda, mulai minggu ini kumpul di gang maksimal sampai jam 23.00 ya. Biar tetangga bisa istirahat 🙏",ronda_muda:"Kabar baru: Dimas, Andi, dan teman-teman jadi tim ronda muda tiap Jumat dan Sabtu malam! Nongkrongnya sekalian jaga gang 💪"},pos:["Nah, gang jadi aman.","Bagus, Pak RT."],neg:["Semoga nggak berisik lagi.","Hmm, kita lihat saja."],by:{dimas:{pos:"Siap, Pak RT. Kita jaga.",neg:"Jam 11? Kayak anak sekolah aja, Pak."},andi:{pos:"Asik, ronda sambil nongkrong!",neg:"Ya elah, kaku banget."},pak_budi:{pos:"Begitu seharusnya.",neg:"Cuma diajak ngobrol? Tetap berisik nanti."}}},paket_hilang:{t:"g",c:{papan:"Bapak-ibu, kalau sedang tidak di rumah, paket boleh dititipkan ke pos ronda ya. Kurir sudah saya kabari 📦",ganti:["sinta","Mbak Sinta, untuk paket yang hilang, RT bantu ganti sebagian dari kas ya. Maaf atas kejadiannya 🙏"],usul_cctv:"Soal paket yang hilang, saya usulkan pemasangan CCTV di rapat berikutnya. Sementara mohon waspada dulu ya, Bapak-ibu."},pos:["Terima kasih, Pak RT. Lega dengarnya.","Pos ronda jadi berguna juga 👍"],neg:["Kok yang hilang ditanggung kas?","Rapat masih lama, Pak."]},surat_pengantar:{t:"bu_lina",c:{prosedur:"Bu Lina, maaf ya, surat pengantarnya harus lengkap dokumennya dulu sesuai prosedur. Nanti Bu Rina bantu cek, insyaallah cepat 🙏",cepat:"Bu Lina, surat pengantarnya sudah saya tanda tangani. Dokumen pendukungnya tolong disusulkan minggu ini ya.",kilat:"Bu Lina, saya sudah minta Bu Rina bantu proses kilat. Siang ini suratnya bisa diambil di rumah Bu Rina ya."},pos:["Ya Allah, makasih banyak Pak RT. Saya tertolong.","Siap, Pak."],neg:["Saya butuh hari ini, Pak…","Baik, Pak. Saya usahakan."]},warga_baru_sinta:{t:"g",c:{kunjungi:"Assalamualaikum Bapak-bapak Ibu-ibu. Perkenalkan, ini Mbak Sinta, warga baru RT 04, tinggal di kontrakan ujung gang (Blok C No. 10). Sore ini saya ajak keliling kenalan. Mohon dibantu ya 🙏",sari:"Assalamualaikum. Ada warga baru, Mbak Sinta, di kontrakan ujung gang. Bu Sari, nanti diajak ikut arisan PKK ya 😊",data:["pengurus","Bu Rina, ada warga baru atas nama Sinta, kontrakan ujung gang. Fotokopi KTP dan surat pindahnya sudah di saya ya."]},pos:["Waalaikumsalam, selamat datang Mbak Sinta! Kalau butuh apa-apa mampir aja ya 😊","Selamat bergabung, Mbak. Semoga betah di RT 04!"],neg:["Waalaikumsalam. Kontrakan ujung itu ya.","Iya, salam kenal."],by:{sinta:{pos:"Terima kasih, Pak RT. Salam kenal semuanya, mohon bimbingannya 🙏",neg:"Salam kenal, Bapak-ibu."}}},pendataan_ulang:{t:"g",c:{door:"Bapak-ibu, minggu ini saya dan Bu Rina keliling pendataan ulang KK. Mohon siapkan KK dan KTP ya 🙏",wa:"Bapak-ibu, untuk pendataan ulang KK, mohon isi formulir di link ini paling lambat Jumat ya. Kalau bingung, japri Bu Rina.",bagi:["pengurus","Bu Rina, Pak Arman, pendataan ulang kita bagi dua ya: Bu Rina blok depan, Pak Arman blok belakang. Fotokopi pakai kas."]},pos:["Siap, Pak. KK sudah saya siapkan.","Bisa, Pak. Saya mulai besok."],neg:["Formulir online ribet buat yang sepuh, Pak.","Saya lagi banyak kerjaan, Pak."]},warga_sakit:{t:"g",c:{kas:"Innalillahi. Salah satu tetangga kita di gang belakang sedang dirawat. RT menyalurkan santunan dari kas. Mohon doanya ya, Bapak-ibu 🤲",galang:"Bapak-ibu, tetangga kita di gang belakang sedang dirawat dan keluarganya butuh bantuan. Yang ingin menyumbang, bisa lewat Bu Wati ya 🤲",kunjung:["bu_wati","Bu Wati, sore ini saya mau jenguk ke rumah sakit, bawa buah. Ibu mau ikut?"]},pos:["Aamiin. Semoga cepat sembuh 🤲","Saya ikut nyumbang, Pak."],neg:["Kok santunan cuma dari kas? Warga juga mau bantu.","Semoga cukup ya, Pak."]},grup_wa_ribut:{t:"g",c:{aturan:"Bapak-ibu, mohon maaf mengingatkan: grup ini untuk info dan musyawarah warga. Beda pendapat boleh, saling sindir jangan ya 🙏",penengah:"Tadi saya sudah telepon Bu Maya dan Pak
